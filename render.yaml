services:
  - type: web
    name: agrivision-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MONGODB_URI
        sync: false
      - key: MQTT_BROKER_HOST
        value: 67000403e5584b348d982f289c69b053.s1.eu.hivemq.cloud
      - key: MQTT_BROKER_PORT
        value: "8883"
      - key: MQTT_BROKER_USERNAME
        value: Agrivision
      - key: MQTT_BROKER_PASSWORD
        sync: false
